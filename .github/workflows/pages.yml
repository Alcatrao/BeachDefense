name: Publish three game versions

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: [Wave branch updated]
    types: [completed]
    branches: [codex/breaking-surf, claude/shorebreak-waves]

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1
      - name: Fetch independent published versions
        run: git fetch --depth=1 origin codex/breaking-surf:refs/remotes/origin/codex/breaking-surf claude/shorebreak-waves:refs/remotes/origin/claude/shorebreak-waves
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Assemble runtime files only
        run: python tooling/pages/build.py
      - uses: actions/checkout@v6
        with:
          ref: codex/breaking-surf
          path: _checks/codex
      - name: Verify Codex physics and measure shoreline flow when available
        run: |
          if [ -f _checks/codex/tooling/v8/verify.mjs ]; then
            git fetch --depth=1 origin 705a2edb2076c3da48173fa22206b369c5b81831
            git show 705a2edb2076c3da48173fa22206b369c5b81831:js/coast/fluid.mjs > _checks/codex/tooling/v8/baseline-fluid.mjs
            node _checks/codex/tooling/v8/verify.mjs
            node _checks/codex/tooling/v7/contact.mjs
            mkdir -p pages-evidence/physics
            cp _checks/codex/verification/v8/*.json pages-evidence/physics/
            cp _checks/codex/verification/v7/contact-60.json pages-evidence/physics/
          fi
      - name: Install browser test runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test original and both subfolder versions before publishing
        run: node tooling/pages/smoke.cjs
      - name: Preserve browser verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pages-browser-evidence
          path: pages-evidence/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish the tested artifact
        id: deployment
        uses: actions/deploy-pages@v4
